[project]
name = "supportiq-backend"
version = "0.1.0"
description = "SupportIQ backend - AI-assisted support ticket management"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1",
    "flask-migrate>=4.0",
    "flask-sqlalchemy>=3.1",
    "gunicorn>=26.2.0",
    "httpx>=0.27",
    "pgvector>=0.4",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "postgres: needs a real PostgreSQL with pgvector (TEST_DATABASE_URL); skipped otherwise",
]
